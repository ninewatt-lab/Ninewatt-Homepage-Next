name: Deploy to AWS EC2

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ninewatt-homepage

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_TAG="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          IMAGE_LATEST="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"

          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .

          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 검색엔진 소유확인. 서버 전용 변수라 런타임에 읽히므로 재빌드 불필요.
          # 시크릿 미설정 시 빈 값 → layout.tsx가 meta 태그를 아예 출력하지 않는다.
          NAVER_SITE_VERIFICATION: ${{ secrets.NAVER_SITE_VERIFICATION }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,TEAMS_WEBHOOK_URL,ANTHROPIC_API_KEY,NAVER_SITE_VERIFICATION,GOOGLE_SITE_VERIFICATION
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${ECR_REGISTRY}
            IMAGE_TAG="${ECR_REGISTRY}/ninewatt-homepage:${{ github.sha }}"
            docker pull ${IMAGE_TAG}

            # 앱 컨테이너 교체
            docker stop ninewatt-homepage || true
            docker rm ninewatt-homepage || true
            docker run -d \
              --name ninewatt-homepage \
              --restart unless-stopped \
              -p 3000:3000 \
              -e "TEAMS_WEBHOOK_URL=$TEAMS_WEBHOOK_URL" \
              -e "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" \
              -e "NAVER_SITE_VERIFICATION=$NAVER_SITE_VERIFICATION" \
              -e "GOOGLE_SITE_VERIFICATION=$GOOGLE_SITE_VERIFICATION" \
              ${IMAGE_TAG}
